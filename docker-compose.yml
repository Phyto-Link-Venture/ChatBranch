# ChatBranch — the long-lived processes.
#
# `docker compose up` boots the API and the dashboard with zero credentials in
# sandbox mode. Optional profiles add PostgreSQL (`postgres`, see below), the
# WhatsApp Web gateway (`whatsapp`), a local Whisper for customers' voice notes
# (`stt`) and the LiveKit voice-agent worker for AI calls (`voice`: LiveKit +
# provider keys in backend/.env for the worker, and LIVEKIT_* /
# SIP_OUTBOUND_TRUNK_ID exported or in the repo-root .env for the API to dial).
#
# Hardening (docs/security.md): every service runs with no-new-privileges; the
# ChatBranch services drop the Linux capabilities they don't use (they listen on
# ports above 1024): the API (its image's non-root `app` user) and the dashboard
# drop all of them; the WhatsApp gateway and the voice agent run as root in their
# images and share the data volume with the API's `app` user, so they keep only the
# file-permission ones (DAC_OVERRIDE, FOWNER) and drop the rest. The API and
# the gateway also run on a read-only root filesystem, writing only to their
# volumes and a private /tmp. The third-party images (Whisper, PostgreSQL) keep
# their own users and capabilities.
#
# Database: a SQLite file on the data volume by default. For PostgreSQL put in
# the repo-root .env (docs/postgres.md has the full switch-over):
#   COMPOSE_PROFILES=postgres          (comma-join with other profiles)
#   DATABASE_PROVIDER=postgres
#   POSTGRES_PASSWORD=<a long random string>
#   DB_IMPORT_SQLITE=/data/chatbranch.sqlite3   (first boot: copy the SQLite data in)
services:
  api:
    build:
      context: ./backend-csharp
    ports:
      - "8090:8090"
    environment:
      # CORS: the dashboard's public origin(s). Comma-separated.
      - Cors__Origins__0=http://localhost:3000
      # Where the OAuth callback bounces the operator back to.
      - FRONTEND_URL=http://localhost:3000
      # AI calls (optional): the LiveKit control plane the API dials through —
      # taken from your shell or the repo-root .env compose reads; unset keeps
      # dialing a clean 503.
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - SIP_OUTBOUND_TRUNK_ID=${SIP_OUTBOUND_TRUNK_ID:-}
      - AGENT_NAME=${AGENT_NAME:-chatbranch-agent}
      # WhatsApp Web (profile `whatsapp`): where the gateway listens and the
      # secret both sides send — the same value the baileys service gets below.
      # Without the profile the host doesn't resolve and QR accounts read as
      # unreachable; a URL saved in the dashboard still wins.
      - BAILEYS_URL=${BAILEYS_URL:-http://baileys:3020}
      - BAILEYS_SECRET=${BAILEYS_SECRET:-baileys-local-dev}
      # Voice-note transcription (optional; a choice saved in Settings → AI keys &
      # models wins). STT_PROVIDER=local + profile `stt` = the internal Whisper
      # below, reached at http://whisper:8000/v1 — no OpenAI key involved.
      - STT_PROVIDER=${STT_PROVIDER:-}
      - STT_BASE_URL=${STT_BASE_URL:-}
      - STT_MODEL=${STT_MODEL:-}
      # Database: sqlite (the file below) | postgres (profile `postgres`). The URL
      # is only read for postgres; DB_IMPORT_SQLITE copies an old SQLite file in on
      # the first Postgres boot (an empty database only — safe to leave set).
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-postgres://chatbranch:${POSTGRES_PASSWORD:-chatbranch-local-dev}@postgres:5432/chatbranch}
      - DB_IMPORT_SQLITE=${DB_IMPORT_SQLITE:-}
      # Security (docs/security.md). The first sign-in password of the seeded
      # superadmin — without it the POC password works once and must be changed.
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-}
      # Proxies whose X-Forwarded-For / -Proto the API believes (IPs / CIDRs);
      # empty = loopback + the private ranges Docker uses.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Request rate limits on (RATE_LIMIT=0 turns them off).
      - RATE_LIMIT=${RATE_LIMIT:-1}
      # The root filesystem is read-only: Chromium (custom document layouts),
      # ffmpeg and .NET keep their scratch and caches in /tmp.
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
    depends_on:
      # only when the `postgres` profile is on; with SQLite nothing waits
      postgres:
        condition: service_healthy
        required: false
    volumes:
      # SQLite is a FILE — without this volume every redeploy starts from an
      # empty database and re-seeds the demo users. It is also the data dir the
      # voice agent shares (live transcripts, operator inbox, calls.json).
      - chatbranch-data:/data
    # writes only to /data (database, media, Data Protection keys in /data/keys)
    # and /tmp (Chromium's throw-away profile, PDF scratch)
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* are baked into the client bundle at BUILD time, so this
        # must be the browser-reachable API URL, not the compose service name.
        - NEXT_PUBLIC_API_URL=http://localhost:8090/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    # Next.js writes its runtime caches under .next/cache, so the root stays writable
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  # Optional: unofficial WhatsApp Web transport. Its paired session lives in the
  # volume — losing it means re-scanning the QR.
  baileys:
    build:
      context: ./backend/baileys_service
    environment:
      - API_URL=http://api:8090
      - BAILEYS_SECRET=${BAILEYS_SECRET:-baileys-local-dev}
      # listen beyond loopback so the api container can reach it (no host port)
      - BAILEYS_HOST=0.0.0.0
    volumes:
      # the API's data dir: call recordings (whatsapp/calls/recordings) land
      # where the API streams them from
      - chatbranch-data:/srv/data
      # the paired WhatsApp sessions stay in their own volume, mounted over it
      - baileys-auth:/srv/data/whatsapp/baileys
    depends_on:
      - api
    # writes only to its two volumes (sessions, events.log, call recordings) + /tmp
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: ["no-new-privileges:true"]
    # the entrypoint starts as root only to hand older, root-owned session files to the
    # unprivileged `app` user (CHOWN, DAC_OVERRIDE, FOWNER) and drop to it (SETUID,
    # SETGID); the gateway itself then runs with no capabilities at all
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    restart: unless-stopped
    profiles: ["whatsapp"]

  # Optional: the LiveKit voice-agent worker that runs every AI call. It reaches
  # LiveKit, not the API: the two share files on the data volume.
  agent:
    build:
      context: ./backend/voice_agent
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - CHATBRANCH_DATA_DIR=/data
      # same name the API dispatches (above)
      - AGENT_NAME=${AGENT_NAME:-chatbranch-agent}
    volumes:
      - chatbranch-data:/data
    # the LiveKit plugins may fetch model files at start-up, so the root stays writable
    security_opt: ["no-new-privileges:true"]
    # the entrypoint starts as root only to hand older, root-owned files in the shared
    # data volume to the unprivileged `app` user (CHOWN, DAC_OVERRIDE, FOWNER) and drop
    # to it (SETUID, SETGID); the worker itself then runs with no capabilities at all
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    restart: unless-stopped
    profiles: ["voice"]

  # Optional: local speech-to-text for customers' voice notes (an OpenAI-
  # compatible Whisper: POST /v1/audio/transcriptions). INTERNAL ONLY — no
  # `ports:`, so nothing on the internet can reach it; the API calls
  # http://whisper:8000/v1 over the compose network. Turn it on with
  # COMPOSE_PROFILES=stt (or --profile stt) and STT_PROVIDER=local (or pick
  # "Local Whisper" in Settings → AI keys & models → Advanced). WHISPER_IMAGE
  # swaps the server; the model is cached in the whisper-models volume.
  whisper:
    image: ${WHISPER_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    environment:
      - PRELOAD_MODELS=["${STT_MODEL:-Systran/faster-whisper-small}"]
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    profiles: ["stt"]

  # Optional: PostgreSQL instead of the SQLite file (profile `postgres` +
  # DATABASE_PROVIDER=postgres on the api). INTERNAL ONLY — no `ports:`; the api
  # reaches it as postgres:5432. C.UTF-8 = byte-order sorting like SQLite, with
  # Unicode upper/lower case. Its data lives in the postgres-data volume.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    environment:
      - POSTGRES_DB=chatbranch
      - POSTGRES_USER=chatbranch
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatbranch-local-dev}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbranch -d chatbranch"]
      interval: 5s
      timeout: 5s
      retries: 30
    # the image's own user switch (gosu) works under no-new-privileges; its
    # capabilities and filesystem are left as the image expects
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    profiles: ["postgres"]

  # With `postgres`: a pg_dump every PG_BACKUP_HOURS (default 24) into the data
  # volume's backups/postgres/, kept PG_BACKUP_KEEP_DAYS (default 14) — so the
  # data-volume snapshot a deploy already takes carries a recent database dump.
  postgres-backup:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    environment:
      - PGHOST=postgres
      - PGUSER=chatbranch
      - PGPASSWORD=${POSTGRES_PASSWORD:-chatbranch-local-dev}
      - PGDATABASE=chatbranch
      - PG_BACKUP_HOURS=${PG_BACKUP_HOURS:-24}
      - PG_BACKUP_KEEP_DAYS=${PG_BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/backups/postgres
        while true; do
          f=/data/backups/postgres/chatbranch-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz
          if pg_dump --no-owner --no-privileges | gzip > "$$f.part"; then mv "$$f.part" "$$f"; echo "backup $$f"; else rm -f "$$f.part"; echo "backup FAILED"; fi
          find /data/backups/postgres -name 'chatbranch-*.sql.gz' -mtime +$${PG_BACKUP_KEEP_DAYS} -delete
          sleep $$(( $${PG_BACKUP_HOURS} * 3600 ))
        done
    volumes:
      - chatbranch-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    profiles: ["postgres"]

volumes:
  chatbranch-data:
  baileys-auth:
  whisper-models:
  postgres-data:
