# ChatBranch — Next.js dashboard + C# API, single origin.
# chatbranch.phytolink-venture.com
#   /      -> web  (Next.js) 127.0.0.1:3010
#   /api   -> api  (C# ASP.NET) 127.0.0.1:8091  (keeps the /api prefix)
#   /mcp, /widget.js -> api as well (the API also serves both under /api/,
#   which is what the dashboard hands out; these keep old links working)
# Certbot rewrites this file to add the 443 server + HTTP->HTTPS redirect.
#
# Security headers (docs/security.md): the API and the dashboard set their own —
# the dashboard's CSP lets ONE page be framed (/help/manual?embed=1), so nginx never
# overrides them. It only fills in the essentials when the upstream sent none (its
# own 502 page, an upstream that is down), HSTS included. The API learns the
# client's real IP from X-Forwarded-For because 127.0.0.1 / the Docker bridge is in
# its TRUSTED_PROXIES default — keep this proxy the only way in.

# a header the upstream already sent wins; an empty value = nginx adds nothing
map $upstream_http_x_content_type_options $cb_nosniff {
    ''      'nosniff';
    default '';
}
map $upstream_http_referrer_policy $cb_referrer {
    ''      'strict-origin-when-cross-origin';
    default '';
}
map $upstream_http_strict_transport_security $cb_hsts {
    ''      'max-age=31536000';
    default '';
}
# no frame header and no CSP from upstream (an nginx error page): refuse framing
map "$upstream_http_x_frame_options$upstream_http_content_security_policy" $cb_frame {
    ''      'DENY';
    default '';
}

server {
    server_name chatbranch.phytolink-venture.com;
    listen 80;
    listen [::]:80;

    # no nginx version on error pages or in the Server header, no framework banner
    server_tokens off;
    proxy_hide_header X-Powered-By;

    client_max_body_size 25M;

    # HTTPS only from the first visit on (browsers ignore it over plain http, so the
    # Certbot redirect still works); the dashboard and the API send their own (never
    # twice), this covers the rest. Add "; includeSubDomains" only when every
    # subdomain of this name serves HTTPS.
    add_header Strict-Transport-Security $cb_hsts always;
    add_header X-Content-Type-Options $cb_nosniff always;
    add_header Referrer-Policy $cb_referrer always;
    add_header X-Frame-Options $cb_frame always;

    # --- C# API. SSE endpoints (chat/voice live streams) need buffering off
    #     and a long read timeout, or updates arrive in stalled bursts. ---
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx APPENDS the address it saw; the API reads X-Forwarded-For from the right
        # and stops at the first address that is not a trusted proxy, so whatever a
        # client pre-fills is never believed (a CDN in front: add its ranges to TRUSTED_PROXIES)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # --- the API's two root-level routes: the MCP endpoint and the widget script ---
    location = /mcp {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
    location = /widget.js {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Next.js dashboard (also serves _next, static, HMR-less prod). ---
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
