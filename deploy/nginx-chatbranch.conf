# ChatBranch — Next.js dashboard + C# API, single origin.
# chatbranch.phytolink-venture.com
#   /      -> web  (Next.js) 127.0.0.1:3010
#   /api   -> api  (C# ASP.NET) 127.0.0.1:8091  (keeps the /api prefix)
# Certbot rewrites this file to add the 443 server + HTTP->HTTPS redirect.
server {
    server_name chatbranch.phytolink-venture.com;
    listen 80;
    listen [::]:80;

    client_max_body_size 25M;

    # --- C# API. SSE endpoints (chat/voice live streams) need buffering off
    #     and a long read timeout, or updates arrive in stalled bursts. ---
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # --- Next.js dashboard (also serves _next, static, HMR-less prod). ---
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
