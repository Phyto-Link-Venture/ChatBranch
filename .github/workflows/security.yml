name: Security

# Supply-chain + secret scanning (docs/security.md). A separate workflow on
# purpose: the deploy listens to "CI", and a newly published advisory should not
# block a deploy of unrelated work — it shows up here, red, until it is fixed.
#   * NuGet: `dotnet list package --vulnerable --include-transitive` — any High /
#     Critical package fails.
#   * npm: `npm audit --omit=dev` for the dashboard and the two Node sidecars —
#     a High / Critical advisory fails unless it is accepted, with a reason and a
#     review-by date, in .github/security/npm-audit-allowlist.json
#     (scripts/npm-audit-gate.mjs).
#   * Secrets: gitleaks (pinned, checksum-verified) over the new commits and the
#     working tree; the whole history on the weekly run.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 3 * * 1' # Mondays 03:23 UTC — catches advisories published since the last push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuget:
    name: NuGet vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore "$GITHUB_WORKSPACE/backend-csharp/ChatBranch.sln"
      - name: Vulnerable packages (High / Critical fail)
        run: |
          dotnet list "$GITHUB_WORKSPACE/backend-csharp/ChatBranch.sln" package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -Eq '[[:space:]](High|Critical)[[:space:]]' vulnerable.txt; then
            echo "::error title=Vulnerable NuGet package::A High or Critical advisory — upgrade the package (pin a patched transitive version in the .csproj if needed)."
            exit 1
          fi

  npm:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [frontend, backend/baileys_service, backend/voice_agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # reads the lockfile only — nothing is installed
      - name: High / Critical advisories in production dependencies
        run: node scripts/npm-audit-gate.mjs "${{ matrix.dir }}"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          gitleaks version
      - name: Scan the new commits (the whole history on the weekly run)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          range=""
          if [ "$EVENT" = "pull_request" ]; then range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then range="$PUSH_BEFORE..$GITHUB_SHA"
          fi
          if [ -n "$range" ]; then
            gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="$range" .
          else
            gitleaks git --no-banner --redact --config .gitleaks.toml .
          fi
      - name: Scan the working tree
        run: gitleaks dir --no-banner --redact --config .gitleaks.toml .
