name: Deploy to production

# This repo already has CI (API build + tests, dashboard types/lint/build,
# sidecar self-tests), so the deploy WAITS for it instead of racing it: a push
# that breaks the tests never reaches production. workflow_dispatch stays open
# as a manual override from the Actions tab.
#
# The self-hosted runner on the production host runs the deploy script that
# already lives there (/root/deploy/deploy-chatbranch.sh). There is deliberately
# no actions/checkout step: the script operates on the real deployment tree.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Never let two deploys overlap; queue instead of cancelling, because cancelling
# mid-build can leave half-swapped containers.
concurrency:
  group: deploy-chatbranch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, chatbranch]
    timeout-minutes: 45
    # Manual runs always proceed; automatic ones only when CI went green.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy chatbranch
        run: /root/deploy/deploy-chatbranch.sh
