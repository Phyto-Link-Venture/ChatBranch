name: CI

# Runs the checks the repo already has but nobody ran automatically: the API
# build + tests, the dashboard's types, lint and production build, and the two
# Node sidecars' offline self-tests.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: C# API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend-csharp/ChatBranch.sln
      - name: Build
        run: dotnet build backend-csharp/ChatBranch.sln -c Release --no-restore
      - name: Test
        # QUEUE_WORKER=0 stops the outbound-queue drain thread racing assertions
        env:
          QUEUE_WORKER: '0'
        run: dotnet test backend-csharp/tests/ChatBranch.Tests -c Release --no-build --verbosity normal

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src
      - name: Build
        run: npx next build

  gateway:
    name: Baileys gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/baileys_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      # The gateway has no test suite; its own offline self-check is the gate.
      - name: Call-engine self-test
        run: node calls.js --selftest
      - name: Outbound-media self-test
        run: node media.js --selftest

  agent:
    name: Voice agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/voice_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/voice_agent/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npx tsc --noEmit
      # Offline: metadata, prompts, call-ending cues, file IPC, WAV writer,
      # WebRTC VAD and provider wiring — no LiveKit server, no keys.
      - name: Self-test
        run: npm run selftest
