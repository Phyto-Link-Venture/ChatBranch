name: CI

# The API build + tests (on SQLite and again on PostgreSQL), the dashboard's
# types, lint and production build, and the two Node sidecars' offline
# self-tests. Built for wall-clock time — the deploy waits for this workflow:
#   * "What changed" runs first and the rest runs only where the push changed
#     something (anything it cannot work out = run everything);
#   * the API suite is split into 3 shards per database (TEST_SHARD=i/3, see
#     tests/ChatBranch.Tests/BoundedParallelFramework.cs), six jobs in parallel;
#   * the dashboard's checks (tsc + eslint) and its build run side by side, the
#     build skipping the checks it would otherwise repeat (NEXT_SKIP_CHECKS=1).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      api_matrix: ${{ steps.diff.outputs.api_matrix }}
      web: ${{ steps.diff.outputs.web }}
      gateway: ${{ steps.diff.outputs.gateway }}
      agent: ${{ steps.diff.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        name: Compare with the previous commit
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full='[{"db":"sqlite","shard":"1/3","filter":""},{"db":"sqlite","shard":"2/3","filter":""},{"db":"sqlite","shard":"3/3","filter":""},{"db":"postgres","shard":"1/3","filter":""},{"db":"postgres","shard":"2/3","filter":""},{"db":"postgres","shard":"3/3","filter":""}]'
          # the API tests that read dashboard files (the capability catalog + every
          # capability the dashboard gates on) — all a dashboard-only change needs
          contract='[{"db":"sqlite","shard":"contract","filter":"FullyQualifiedName~ChatBranch.Tests.PermissionCatalogTests."}]'
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          everything() {
            echo "Running everything: $1"
            out api true; out api_matrix "$full"; out web true; out gateway true; out agent true
            exit 0
          }
          case "$EVENT" in
            push) from="$BEFORE" ;;
            pull_request) from="$BASE" ;;
            *) everything "a $EVENT run" ;;
          esac
          if [ -z "$from" ] || [ "$from" = 0000000000000000000000000000000000000000 ]; then everything "no previous commit"; fi
          git fetch --no-tags --depth=1 origin "$from" || everything "the previous commit could not be fetched"
          files=$(git diff --name-only "$from" HEAD) || everything "git diff failed"
          echo "Changed files:"; echo "$files"
          has() { grep -qE "$1" <<< "$files"; }
          has '^\.github/workflows/ci\.yml$' && everything "the CI workflow changed"
          if has '^backend-csharp/|^docs/mcp\.md$'; then out api true; out api_matrix "$full"
          elif has '^frontend/src/'; then out api true; out api_matrix "$contract"
          else out api false; out api_matrix '[]'; fi
          has '^frontend/' && out web true || out web false
          has '^backend/baileys_service/' && out gateway true || out gateway false
          has '^backend/voice_agent/' && out agent true || out agent false

  api:
    name: C# API (${{ matrix.db }} ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # a hung test fails the run instead of holding a runner for six hours
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.api_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend-csharp/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Start PostgreSQL
        # a container, not a `services:` entry: services can't take server flags,
        # and the suite opens more than the default 100 connections
        if: matrix.db == 'postgres'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=C.UTF-8" postgres:16-bookworm \
            -c max_connections=400 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for i in $(seq 1 60); do docker exec pg pg_isready -U postgres && break; sleep 1; done
      - name: Restore
        run: dotnet restore backend-csharp/tests/ChatBranch.Tests
      - name: Build
        # the test project builds the API and everything it references
        run: dotnet build backend-csharp/tests/ChatBranch.Tests -c Release --no-restore
      - name: Test
        # QUEUE_WORKER=0 stops the outbound-queue drain thread racing assertions;
        # TEST_SHARD picks this job's third of the test classes
        env:
          QUEUE_WORKER: '0'
          TEST_SHARD: ${{ matrix.filter == '' && matrix.shard || '' }}
          TEST_DATABASE: ${{ matrix.db == 'postgres' && 'postgres' || '' }}
          TEST_POSTGRES: ${{ matrix.db == 'postgres' && 'Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres' || '' }}
          FILTER: ${{ matrix.filter }}
        run: >-
          dotnet test backend-csharp/tests/ChatBranch.Tests -c Release --no-build
          ${FILTER:+--filter "$FILTER"}
          --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
      - name: Failed tests
        # one readable block naming each failure, its message and the top of its stack
        if: failure()
        env:
          WHERE: ${{ matrix.db }} ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import glob, os, re
          where = os.environ.get('WHERE', '')
          for f in glob.glob('backend-csharp/tests/ChatBranch.Tests/TestResults/*.trx'):
              s = open(f, encoding='utf-8').read()
              for m in re.finditer(r'<UnitTestResult [^>]*testName="([^"]+)"[^>]*outcome="Failed"[\s\S]*?<Message>([\s\S]*?)</Message>(?:[\s\S]*?<StackTrace>([\s\S]*?)</StackTrace>)?', s):
                  print(f'::error title=Failed test ({where})::' + m.group(1))
                  print(m.group(1)); print(m.group(2)[:2000]); print((m.group(3) or '')[:1500]); print('-' * 60)
          PY
      - name: PostgreSQL log
        if: failure() && matrix.db == 'postgres'
        run: docker logs pg 2>&1 | tail -n 80
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-${{ matrix.db }}-${{ strategy.job-index }}
          path: backend-csharp/tests/ChatBranch.Tests/TestResults/*.trx
          if-no-files-found: ignore

  web-checks:
    name: Dashboard checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src

  web-build:
    name: Dashboard build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build
        # types + lint run in "Dashboard checks", side by side with this job
        env:
          NEXT_SKIP_CHECKS: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npx next build

  gateway:
    name: Baileys gateway
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/baileys_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      # The gateway has no test suite; its own offline self-check is the gate.
      - name: Call-engine self-test
        run: node calls.js --selftest
      - name: Outbound-media self-test
        run: node media.js --selftest

  agent:
    name: Voice agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/voice_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/voice_agent/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npx tsc --noEmit
      # Offline: metadata, prompts, call-ending cues, file IPC, WAV writer,
      # WebRTC VAD and provider wiring — no LiveKit server, no keys.
      - name: Self-test
        run: npm run selftest
