name: Release

# Publishes the four ChatBranch images for installs on OTHER companies' servers
# (deploy/customer/): prebuilt, no source code. It does not touch the own
# servers' deploy — that one waits for "CI" (deploy.yml) and builds from source.
#
#   ghcr.io/<owner>/chatbranch-api      the C# API (compiled assemblies, no .pdb)
#   ghcr.io/<owner>/chatbranch-web      the dashboard (Next.js standalone server,
#                                       built with NEXT_PUBLIC_API_URL=/api so one
#                                       image works on any domain)
#   ghcr.io/<owner>/chatbranch-baileys  the WhatsApp Web gateway (profile whatsapp)
#   ghcr.io/<owner>/chatbranch-agent    the voice-agent worker (profile voice)
#
# Each is tagged :<version> and :latest (not :latest for a pre-release such as
# 1.4.0-rc.1), carries an SBOM and max-mode SLSA provenance attestation, and is
# signed with cosign keyless (Sigstore, this workflow's GitHub OIDC identity).
#
# Cut a release: tag a commit whose CI run is green and push the tag —
#   git tag v1.4.0 && git push origin v1.4.0
# or Actions → Release → Run workflow (version 1.4.0, on the branch to build).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.4.0 (a leading v is dropped)'
        required: true
        type: string
      allow_untested:
        description: 'Publish even if CI has not passed for this commit'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version and CI check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - name: Work out the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="$INPUT_VERSION"; else v="$GITHUB_REF_NAME"; fi
          v="${v#v}"
          # semver without build metadata (`+` is not allowed in an image tag)
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::'$v' is not a version like 1.4.0 or 1.4.0-rc.1"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$v"
            echo "prerelease=$pre"
            echo "owner=$owner"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $v (pre-release: $pre) to ghcr.io/$owner/chatbranch-*"

      - name: CI passed for this commit
        # Customers get exactly what was tested: the commit must have a green
        # "CI" run (ci.yml). A tag pushed before CI finished fails here — wait for
        # CI, then re-run this workflow.
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_UNTESTED: ${{ inputs.allow_untested && 'true' || 'false' }}
        run: |
          n="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')"
          if [ "${n:-0}" -gt 0 ]; then
            echo "CI passed for $GITHUB_SHA."
          elif [ "$ALLOW_UNTESTED" = "true" ]; then
            echo "::warning::No green CI run for $GITHUB_SHA — publishing anyway (allow_untested)."
          else
            echo "::error::No green CI run for $GITHUB_SHA. Wait for CI (or fix it) and re-run, or run this workflow by hand with allow_untested."
            exit 1
          fi

  images:
    name: Image (${{ matrix.name }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # cosign keyless signing (Sigstore, GitHub OIDC)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend-csharp
            description: ChatBranch API (ASP.NET Core 8)
            build-args: ''
          - name: web
            context: frontend
            description: ChatBranch dashboard (Next.js standalone)
            # relative API base: one image for every domain behind a
            # single-origin proxy (/api/* → api, the rest → web)
            build-args: |
              NEXT_PUBLIC_API_URL=/api
          - name: baileys
            context: backend/baileys_service
            description: ChatBranch WhatsApp Web gateway (Baileys)
            build-args: ''
          - name: agent
            context: backend/voice_agent
            description: ChatBranch voice-agent worker (LiveKit Agents)
            build-args: ''
    env:
      IMAGE: ghcr.io/${{ needs.version.outputs.owner }}/chatbranch-${{ matrix.name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags, labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},priority=1000
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=chatbranch-${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          annotations: |
            org.opencontainers.image.title=chatbranch-${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          # fresh base images (security fixes) — no build cache across releases
          pull: true
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          {
            echo "### chatbranch-${{ matrix.name }} $VERSION"
            echo
            echo "- \`$IMAGE:$VERSION\`"
            echo "- digest \`$DIGEST\`"
            echo "- signed by \`https://github.com/$GITHUB_WORKFLOW_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
